<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BOC Rate Monitor</title>
  <style>
    :root {
      --line: #ff4b55;
      --glow: rgba(255, 75, 85, 0.14);
      --change: #d1d5db;
      --pill-bg: rgba(209, 213, 219, 0.12);
      --glass-opacity: 0.05;
      --glass-blur: 20px;
      --card-bg: rgba(255, 255, 255, var(--glass-opacity));
      --border: rgba(255, 255, 255, 0.12);
    }

    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
      font-family: "Segoe UI", system-ui, sans-serif;
      user-select: none;
    }

    body {
      display: grid;
      place-items: center;
      padding: 0;
    }

    .card {
      width: 216px;
      height: 112px;
      padding: 8px 14px;
      border-radius: 14px;
      background: var(--card-bg);
      backdrop-filter: blur(var(--glass-blur)) saturate(210%);
      -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(210%);
      border: 1px solid var(--border);
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.15);
      display: grid;
      grid-template-rows: 15px 27px 12px 11px minmax(0, 1fr);
      gap: 1px;
      cursor: default;
      overflow: hidden;
      position: relative;
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-width: 0;
    }

    .pair {
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
    }

    .badge {
      color: rgba(255, 255, 255, 0.9);
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 5px;
      padding: 3px 5px;
      font-size: 8px;
      font-weight: 800;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
    }

    .title {
      color: white;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.55);
      white-space: nowrap;
    }

    .time {
      color: #d1d5db;
      font-family: Consolas, monospace;
      font-size: 9px;
      font-weight: 700;
      opacity: 0;
      transform: translateX(3px);
      transition: opacity 160ms ease, transform 160ms ease;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.55);
    }

    .card:hover .time {
      opacity: 1;
      transform: translateX(0);
    }

    .price {
      color: white;
      font-family: Consolas, "SF Mono", monospace;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 0;
      min-width: 0;
      flex: 1;
      overflow: hidden;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.55);
      white-space: nowrap;
    }

    .pill {
      color: var(--change);
      background: var(--pill-bg);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 6px;
      padding: 2px 7px;
      font-size: 9px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.25);
      min-width: 46px;
      text-align: center;
    }

    .chart {
      width: 100%;
      height: 100%;
      min-height: 0;
      overflow: hidden;
    }

    .change-group { flex: 0 0 auto; display: grid; gap: 2px; text-align: center; }
    .change-label { color: #d1d5db; font-size: 8px; }
    .source { max-width: 105px; font-size: 9px; color: #d1d5db; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .target-status { font-size: 9px; line-height: 12px; color: #e5e7eb; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .chart-meta { display: flex; justify-content: space-between; gap: 4px; font-size: 8px; line-height: 11px; color: #d1d5db; }
    .chart-meta span { white-space: nowrap; }
    #healthText[data-stale="true"] { color: #aeb2b9; }
    .source, .chart-meta { opacity: 0; transition: opacity 120ms ease; }
    .card:hover .source, .card:hover .chart-meta, .card:focus-within .source, .card:focus-within .chart-meta { opacity: 1; }
    .chart-meta #rangeText { display: none; }
    .chart-meta { justify-content: flex-end; }
    .card[data-reached="true"] { border-color: #6ee7b7; }
    .card[data-reached="true"] .target-status { color: #6ee7b7; font-weight: 700; }
    .card[data-stale="true"] .price { color: #aeb2b9; text-shadow: none; }

    .hidden { display: none; }
    .no-drag { -webkit-app-region: no-drag; }

    .settings-panel {
      position: absolute;
      inset: 7px;
      z-index: 10;
      padding: 8px 10px;
      border-radius: 12px;
      background: rgba(22, 28, 38, 0.92);
      backdrop-filter: blur(18px) saturate(160%);
      -webkit-backdrop-filter: blur(18px) saturate(160%);
      border: 1px solid rgba(255, 255, 255, 0.13);
      color: white;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.45);
    }

    .settings-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
      font-size: 11px;
      font-weight: 800;
    }

    .settings-close {
      width: 20px;
      height: 20px;
      border: 0;
      border-radius: 6px;
      color: rgba(255, 255, 255, 0.78);
      background: rgba(255, 255, 255, 0.08);
      font-size: 15px;
      line-height: 18px;
      cursor: pointer;
    }

    .setting-row {
      display: grid;
      grid-template-columns: 36px 1fr 34px;
      align-items: center;
      gap: 6px;
      margin-top: 6px;
      font-size: 9px;
      font-weight: 700;
    }

    .setting-row input {
      width: 100%;
      accent-color: var(--line);
    }

    .setting-value {
      font-family: Consolas, monospace;
      text-align: right;
      color: rgba(255, 255, 255, 0.78);
    }

    .settings-reset {
      margin-top: 7px;
      width: 100%;
      height: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      color: white;
      background: rgba(255, 255, 255, 0.08);
      font-size: 9px;
      font-weight: 800;
      cursor: pointer;
    }

    #alertEditor { padding: 7px 10px; }
    #alertLabel { display: block; font-size: 11px; margin-bottom: 4px; }
    #alertValue { width: 100%; height: 24px; border: 1px solid #737780; border-radius: 4px; padding: 2px 6px; }
    .alert-actions { display: flex; gap: 8px; margin-top: 5px; }
    .alert-actions button { flex: 1; height: 23px; margin: 0; }
  </style>
</head>
<body>
  <main class="card" id="card">
    <section class="row">
      <div class="pair">
        <span class="title" id="pairTitle">GBP/EUR</span>
      </div>
      <span class="source" id="sourceText" tabindex="0">等待报价</span>
    </section>

    <section class="row">
      <span class="price" id="priceText">Loading</span>
      <div class="change-group" id="changeGroup">
        <span class="change-label" id="changeLabel">近30min</span>
        <span class="pill" id="changeText">--</span>
      </div>
    </section>

    <div class="target-status" id="targetStatus" tabindex="0">目标提醒未开启</div>
    <div class="chart-meta"><span id="rangeText" tabindex="0">30min · 本地</span><span id="healthText" tabindex="0">等待报价</span></div>
    <svg class="chart" id="chart" viewBox="0 0 188 23" preserveAspectRatio="none" role="img" aria-label="汇率趋势">
      <title id="chartTitle">暂无数据</title>
      <defs>
        <linearGradient id="areaGradient" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="var(--line)" stop-opacity="0.14"></stop>
          <stop offset="100%" stop-color="var(--line)" stop-opacity="0"></stop>
        </linearGradient>
      </defs>
      <path id="areaPath" fill="url(#areaGradient)"></path>
      <path id="linePath" fill="none" stroke="var(--line)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
      <path id="targetLine" fill="none" stroke="#d1d5db" stroke-width="1" stroke-dasharray="3 3"></path>
      <circle id="dot" r="2.2" fill="var(--line)"></circle>
      <text id="chartMessage" x="94" y="14" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-size="8"></text>
    </svg>

    <section class="settings-panel no-drag hidden" id="settingsPanel">
      <div class="settings-head">
        <span>面板设置</span>
        <button class="settings-close" id="closeSettings" type="button">×</button>
      </div>
      <label class="setting-row">
        <span>白度</span>
        <input id="opacitySlider" type="range" min="0" max="15" step="1" />
        <span class="setting-value" id="opacityValue">5%</span>
      </label>
      <label class="setting-row">
        <span>模糊</span>
        <input id="blurSlider" type="range" min="6" max="36" step="1" />
        <span class="setting-value" id="blurValue">20px</span>
      </label>
      <button class="settings-reset" id="resetPanelSettings" type="button">重置默认</button>
    </section>
    <form class="settings-panel no-drag hidden" id="alertEditor">
      <label id="alertLabel" for="alertValue">涨跌阈值 (%)</label>
      <input id="alertValue" type="number" step="any" min="0" required />
      <div class="alert-actions">
        <button class="settings-reset" id="cancelAlert" type="button">取消</button>
        <button class="settings-reset" type="submit">保存</button>
      </div>
    </form>
  </main>

  <script src="./renderer.js"></script>
</body>
</html>
